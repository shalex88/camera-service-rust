[package]
name = "camera-controller-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
build = "build.rs"
description = "Extensible three-layer camera control service"
license = "MIT"

[lib]
name = "camera_controller_rust"
path = "src/lib.rs"

[[bin]]
name = "camera-controller-rust"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_path_to_error = "0.1.20"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
prost-types = "0.14.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
